# Smithery configuration for JUCESP: Certidão Simplificada
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jucesp_certidao_simplificada

name: jucesp_certidao_simplificada-mcp
displayName: "JUCESP: Certidão Simplificada"
description: >
  Emite a certidão simplificada de uma empresa na JUCESP (comprova registro e situação por CNPJ, NIRE ou nome). Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jucesp_certidao_simplificada-mcp
repository: https://github.com/mcp-dir/jucesp_certidao_simplificada-mcp

tags:
  - jucesp_certidao_simplificada
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jucesp_certidao_simplificada

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jucesp_certidao_simplificada/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
